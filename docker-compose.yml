services:
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: hedera-crawl4ai
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-}
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: hedera-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped
